name: Linux Analysis

on:
  push:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/linux-analysis.yml'
  pull_request:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/linux-analysis.yml'

jobs:
  cppcheck:
    name: Cppcheck Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libcurl4-openssl-dev cppcheck

      - name: Create build directory
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake with Cppcheck
        working-directory: ${{github.workspace}}/build
        run: |
          cmake .. \
            -DBUILD_TESTS=ON \
            -DBUILD_SAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_CURL=ON \
            -DENABLE_CPPCHECK=ON

      - name: Build with Cppcheck
        working-directory: ${{github.workspace}}/build
        continue-on-error: true
        run: cmake --build . --config Release 2>&1 | tee cppcheck-build.log

      - name: Check build result
        working-directory: ${{github.workspace}}/build
        id: cppcheck_result
        run: |
          if [ -f cppcheck.xml ]; then
            echo "has_xml=true" >> $GITHUB_OUTPUT
          else
            echo "has_xml=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Cppcheck XML report
        uses: actions/upload-artifact@v4
        if: steps.cppcheck_result.outputs.has_xml == 'true'
        with:
          name: cppcheck-report
          path: build/cppcheck.xml

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cppcheck-build-log
          path: build/cppcheck-build.log

  sanitizer:
    name: Sanitizer (ASan/UBSan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config libcurl4-openssl-dev

      - name: Create build directory
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake with Sanitizers
        working-directory: ${{github.workspace}}/build
        run: |
          cmake .. \
            -DBUILD_TESTS=ON \
            -DBUILD_SAMPLES=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_CURL=ON \
            -DENABLE_SANITIZER=ON

      - name: Build with Sanitizers
        working-directory: ${{github.workspace}}/build
        run: cmake --build .

      - name: Run Unit Tests with Sanitizers
        working-directory: ${{github.workspace}}/build
        run: ctest -V --output-on-failure -R cpp-sdk-unittest
