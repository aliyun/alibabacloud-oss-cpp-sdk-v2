name: C++23 std::expected CI

on:
  push:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/std-expected.yml'
  pull_request:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/std-expected.yml'

jobs:
  linux:
    name: Linux (GCC 13, C++23)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 libssl-dev libcurl4-openssl-dev

      - name: Configure (static)
        run: |
          cmake -B build-static \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build (static)
        run: cmake --build build-static -j$(nproc)

      - name: Test (static)
        working-directory: build-static
        run: ctest -V --output-on-failure -R cpp-sdk-unittest

      - name: Configure (shared)
        run: |
          cmake -B build-shared \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON

      - name: Build (shared)
        run: cmake --build build-shared -j$(nproc)

  macos:
    name: macOS (AppleClang, C++23)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install curl

      - name: Configure (static)
        run: |
          cmake -B build-static \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build (static)
        run: cmake --build build-static -j$(sysctl -n hw.ncpu)

      - name: Test (static)
        working-directory: build-static
        run: ctest -V --output-on-failure -R cpp-sdk-unittest

      - name: Configure (shared)
        run: |
          cmake -B build-shared \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DUSE_SYSTEM_CURL=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON

      - name: Build (shared)
        run: cmake --build build-shared -j$(sysctl -n hw.ncpu)

  windows:
    name: Windows (MSVC, C++23)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (static)
        shell: bash
        run: |
          cmake -B build-static \
            -A x64 \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DBUILD_TESTS=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build (static)
        shell: bash
        run: cmake --build build-static --config Release -j

      - name: Test (static)
        working-directory: build-static
        shell: bash
        run: ctest -C Release -V --output-on-failure -R cpp-sdk-unittest

      - name: Configure (shared)
        shell: bash
        run: |
          cmake -B build-shared \
            -A x64 \
            -DCMAKE_CXX_STANDARD=23 \
            -DUSE_STD_EXPECTED=ON \
            -DBUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON

      - name: Build (shared)
        shell: bash
        run: cmake --build build-shared --config Release -j
