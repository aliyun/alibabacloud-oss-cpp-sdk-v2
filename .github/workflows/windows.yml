name: Windows CI

on:
  push:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/windows.yml'
  pull_request:
    branches: [main, 'dev-*']
    paths:
      - 'sdk/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/windows.yml'

jobs:
  build:
    name: Windows (${{ matrix.compiler }}, ${{ matrix.std }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]
        std: [c++17, c++20]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up compiler
        shell: bash
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang-cl" >> $GITHUB_ENV
            echo "CXX=clang-cl" >> $GITHUB_ENV
          fi

      # Static library build + unit tests
      - name: Configure CMake (static)
        shell: bash
        run: |
          cmake -B build-static \
            -DBUILD_TESTS=ON \
            -DBUILD_SAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std == 'c++17' && '17' || '20' }} \
            -DBUILD_SHARED_LIBS=OFF

      - name: Build (static)
        shell: bash
        run: cmake --build build-static --config Release --target ALL_BUILD

      - name: Test (static)
        working-directory: build-static
        shell: bash
        run: ctest -C Release -V --output-on-failure -R cpp-sdk-unittest

      # Shared library build (compile-only)
      - name: Configure CMake (shared)
        shell: bash
        run: |
          cmake -B build-shared \
            -DBUILD_TESTS=OFF \
            -DBUILD_SAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=${{ matrix.std == 'c++17' && '17' || '20' }} \
            -DBUILD_SHARED_LIBS=ON

      - name: Build (shared)
        shell: bash
        run: cmake --build build-shared --config Release --target ALL_BUILD
